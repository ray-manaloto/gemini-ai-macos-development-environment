name: DevEnvManager
options:
  bundleIdPrefix: dev.devenvmanager
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: DevEnvManager
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DevEnvManager:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Domain
      - path: Services
      - path: Infrastructure
      - path: Presentation
      - path: Design
      - path: Utilities
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DevEnvManager.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.devenvmanager.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: DevEnvManager
        CFBundleDisplayName: DevEnvManager
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    entitlements:
      path: App/DevEnvManager.entitlements
      properties:
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true

  DevEnvManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DevEnvManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devenvmanager.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DevEnvManager.app/Contents/MacOS/DevEnvManager"
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  DevEnvManager:
    build:
      targets:
        DevEnvManager: all
        DevEnvManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevEnvManagerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

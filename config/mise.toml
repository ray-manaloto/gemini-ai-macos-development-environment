echo ""
echo "=== Health Check ==="
echo "PATH has shims: $(echo $PATH | grep -q 'mise/shims' && echo 'YES' || echo 'NO')"
echo "Bun: $(bun --version 2>/dev/null || echo 'not found')"
echo "Uv: $(uv --version 2>/dev/null | head -1 || echo 'not found')"
echo "Node: $(node --version 2>/dev/null || echo 'not found')"

# === NETWORK CHECKS (Slower, use timeouts) ===
echo ""
echo "=== Cloud (SkyPilot) ==="
if command -v sky &> /dev/null; then
  sky status $REFRESH_FLAG -v 2>/dev/null | head -12 || echo "No SkyPilot clusters"
  echo ""
  COST=$(sky cost-report 2>/dev/null | grep "Total Cost" || true)
  if [ -n "$COST" ]; then
    echo "$COST"
  fi
else
  echo "SkyPilot not installed"
fi

echo ""
echo "=== AWS Services ==="
AWS_CMD=""
if command -v aws &> /dev/null; then
  AWS_CMD="aws"
elif [ -f "$HOME/.local/share/mise/shims/aws" ]; then
  AWS_PATH=$(find "$HOME/.local/share/mise/installs/awscli" -name "aws" -type f 2>/dev/null | head -1)
  if [ -n "$AWS_PATH" ]; then
    AWS_CMD="$AWS_PATH"
  fi
fi

if [ -z "$AWS_CMD" ]; then
  echo "AWS CLI not installed. Install with: mise use -g awscli@latest"
elif ! $AWS_CMD sts get-caller-identity &> /dev/null; then
  echo "AWS credentials not configured. Run: aws configure"
else
  ACCOUNT=$($AWS_CMD sts get-caller-identity --query 'Account' --output text 2>/dev/null || echo "unknown")
  REGION=$($AWS_CMD configure get region 2>/dev/null || echo "us-east-1")
  echo "Account: $ACCOUNT | Region: $REGION"
  echo ""
  
   echo "EC2 Instances (Running):"
   $AWS_CMD ec2 describe-instances --filters Name=instance-state-name,Values=running --query 'Reservations[*].Instances[*].[InstanceId,InstanceType,PublicIpAddress,State.Name]' --output table 2>/dev/null || echo "  No running instances"
   echo ""
   
   echo "RDS Databases:"
   $AWS_CMD rds describe-db-instances --query 'DBInstances[*].[DBInstanceIdentifier,Engine,DBInstanceStatus]' --output table 2>/dev/null || echo "  No RDS instances"
   echo ""
   
   echo "Load Balancers:"
   $AWS_CMD elbv2 describe-load-balancers --query 'LoadBalancers[*].[LoadBalancerName,State.Code,DNSName]' --output table 2>/dev/null || echo "  No load balancers"
   echo ""
   
   echo "S3 Buckets:"
   $AWS_CMD s3api list-buckets --query 'Buckets[*].Name' --output table 2>/dev/null || echo "  No S3 buckets"
fi

echo ""
echo "For detailed SkyPilot info: mise run agent:status"
echo "For standalone AWS view: mise run aws:status"
"""

[tasks."secrets:status:redacted"]
description = "Show secrets status (redacted)"
run = """
bash "$HOME/.config/dev-env/config/scripts/secrets-status.sh" --redacted
"""

[tasks."env:start"]
description = "Start full environment (SKIP_CLOUD=1 to skip cloud agents)"
run = """
echo "=== Starting Environment ==="
mise trust 2>/dev/null || true
mise install
mise reshim
echo ""
if command -v pitchfork &> /dev/null; then
  echo "Starting daemons..."
  pitchfork start 2>/dev/null || echo "No daemons configured"
fi
echo ""
if command -v sky &> /dev/null && [ "${SKIP_CLOUD:-0}" != "1" ]; then
  if ! sky check aws 2>&1 | grep -q "enabled"; then
    echo "=== Cloud Agents ==="
    echo "WARNING: AWS credentials not configured"
    echo "Run 'mise run agent:check' to see setup instructions"
    echo "Or use SKIP_CLOUD=1 to skip cloud operations"
  else
    STOPPED_CLUSTERS=$(sky status 2>/dev/null | grep "STOPPED" | awk '{print $1}')
    if [ -n "$STOPPED_CLUSTERS" ]; then
      echo "=== Starting Cloud Agents ==="
      for cluster in $STOPPED_CLUSTERS; do
        echo "Starting: $cluster"
        sky start -y "$cluster" &
      done
      wait
      echo "Cloud agents started."
    else
      echo "No stopped cloud agents to start."
    fi
  fi
else
  if [ "${SKIP_CLOUD:-0}" = "1" ]; then
    echo "Skipping cloud agents (SKIP_CLOUD=1)"
  fi
fi
echo ""
echo "Environment started. Run 'mise run env:status' to verify."
"""

[tasks."env:stop"]
description = "Stop full environment (SKIP_CLOUD=1 to skip cloud agents)"
run = """
echo "=== Stopping Environment ==="
if command -v pitchfork &> /dev/null; then
  echo "Stopping daemons..."
  pitchfork stop 2>/dev/null || echo "No daemons running"
else
  echo "Pitchfork not installed - no daemons to stop"
fi
echo ""
if command -v sky &> /dev/null && [ "${SKIP_CLOUD:-0}" != "1" ]; then
  RUNNING_CLUSTERS=$(sky status 2>/dev/null | grep "UP" | awk '{print $1}')
  if [ -n "$RUNNING_CLUSTERS" ]; then
    echo "=== Stopping Cloud Agents ==="
    for cluster in $RUNNING_CLUSTERS; do
      echo "Stopping: $cluster"
      sky stop -y "$cluster" &
    done
    wait
    echo "Cloud agents stopped."
  else
    echo "No running cloud agents to stop."
  fi
else
  if [ "${SKIP_CLOUD:-0}" = "1" ]; then
    echo "Skipping cloud agents (SKIP_CLOUD=1)"
  fi
fi
echo ""
echo "Environment stopped. Tools remain installed."
"""

[tasks."env:restart"]
description = "Restart environment"
depends = ["env:stop", "env:start"]
run = """
echo "Environment restarted."
"""

[tasks."env:update"]
description = "Update all tools"
run = """
mise run tools:update
"""

# =============================================================================
# DevContainer Lifecycle Tasks
# =============================================================================

[tasks."devcontainer:status"]
description = "Show DevContainer status"
run = """
echo "=== DevContainer Status ==="

echo ""
echo "Docker Containers:"
if command -v docker &> /dev/null; then
  docker ps -a --filter 'name=devcontainer' --filter 'name=vsc-' --format 'table {% raw %}{{.Names}}{% endraw %}\t{% raw %}{{.Status}}{% endraw %}\t{% raw %}{{.Ports}}{% endraw %}' 2>/dev/null || echo "No devcontainers found"
else
  echo "Docker not installed"
fi

echo ""
echo "DevPod Workspaces:"
if command -v devpod &> /dev/null; then
  devpod list 2>/dev/null || echo "No DevPod workspaces"
else
  echo "DevPod not installed. Install with: mise install"
fi

echo ""
echo "VS Code Remote Containers:"
if command -v code &> /dev/null; then
  code --list-extensions 2>/dev/null | grep -i devcontainer && echo "DevContainer extension installed" || echo "DevContainer extension not found"
else
  echo "VS Code CLI not available"
fi
"""

[tasks."devcontainer:up"]
description = "Start DevContainer (uses DevPod by default, PROVIDER=docker for Docker CLI)"
run = """
PROVIDER="${PROVIDER:-devpod}"
WORKSPACE="${WORKSPACE:-.}"

echo "=== Starting DevContainer ==="

if [ "$PROVIDER" = "devpod" ]; then
  if ! command -v devpod &> /dev/null; then
    echo "DevPod not installed. Installing..."
    mise install devpod
    mise reshim
  fi
  echo "Starting with DevPod..."
  devpod up "$WORKSPACE"
elif [ "$PROVIDER" = "docker" ]; then
  if ! command -v docker &> /dev/null; then
    echo "ERROR: Docker not installed"
    exit 1
  fi
  
  RUNNING=$(docker ps -q --filter 'name=god-tier-devcontainer' 2>/dev/null)
  STOPPED=$(docker ps -aq --filter 'name=god-tier-devcontainer' --filter 'status=exited' 2>/dev/null)
  
  if [ -n "$RUNNING" ]; then
    echo "Container already running."
    echo "Use 'mise run devcontainer:ssh' to connect."
  elif [ -n "$STOPPED" ]; then
    echo "Starting existing container..."
    docker start god-tier-devcontainer
    echo "Container started. Use 'mise run devcontainer:ssh' to connect."
  else
    echo "Building and creating new container..."
    docker build -t god-tier-dev -f .devcontainer/Dockerfile .
    docker run -d --name god-tier-devcontainer \
      -v "$(pwd):/workspaces/project" \
      -v god-tier-mise-data:/home/vscode/.local/share/mise \
      -v god-tier-mise-config:/home/vscode/.config/mise \
      -w /workspaces/project \
      god-tier-dev \
      sleep infinity
    echo "Container created and started. Use 'mise run devcontainer:ssh' to connect."
  fi
else
  echo "Unknown provider: $PROVIDER"
  echo "Use PROVIDER=devpod (default) or PROVIDER=docker"
  exit 1
fi
"""

[tasks."devcontainer:down"]
description = "Stop DevContainer (PROVIDER=devpod|docker)"
run = """
PROVIDER="${PROVIDER:-devpod}"
WORKSPACE="${WORKSPACE:-.}"

echo "=== Stopping DevContainer ==="

if [ "$PROVIDER" = "devpod" ]; then
  if command -v devpod &> /dev/null; then
    devpod stop "$WORKSPACE" 2>/dev/null || echo "No DevPod workspace to stop"
  else
    echo "DevPod not installed"
  fi
elif [ "$PROVIDER" = "docker" ]; then
  CONTAINER=$(docker ps -q --filter 'name=god-tier-devcontainer' 2>/dev/null)
  if [ -n "$CONTAINER" ]; then
    docker stop "$CONTAINER"
    echo "Container stopped."
  else
    echo "No running container found."
  fi
fi

echo ""
echo "DevContainer stopped. Use 'mise run devcontainer:up' to restart."
"""

[tasks."devcontainer:ssh"]
description = "SSH into DevContainer (requires TTY)"
run = """
PROVIDER="${PROVIDER:-docker}"
WORKSPACE="${WORKSPACE:-.}"

# Check for TTY availability
if [ ! -t 0 ]; then
  echo "ERROR: This command requires an interactive terminal (TTY)."
  echo "Use 'mise run devcontainer:exec \"<command>\"' for non-interactive execution."
  exit 1
fi

echo "=== Connecting to DevContainer ==="

if [ "$PROVIDER" = "devpod" ]; then
  if command -v devpod &> /dev/null; then
    devpod ssh "$WORKSPACE"
  else
    echo "DevPod not installed"
    exit 1
  fi
elif [ "$PROVIDER" = "docker" ]; then
  CONTAINER=$(docker ps -q --filter 'name=god-tier-devcontainer' 2>/dev/null | head -1)
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -q --filter 'name=devcontainer' 2>/dev/null | head -1)
  fi
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -q --filter 'name=vsc-' 2>/dev/null | head -1)
  fi
  
  if [ -n "$CONTAINER" ]; then
    docker exec -it "$CONTAINER" zsh || docker exec -it "$CONTAINER" bash
  else
    echo "No running devcontainer found."
    echo "Start one with: mise run devcontainer:up PROVIDER=docker"
    exit 1
  fi
fi
"""

[tasks."devcontainer:build"]
description = "Build DevContainer image"
run = """
echo "=== Building DevContainer Image ==="
if ! command -v docker &> /dev/null; then
  echo "ERROR: Docker not installed"
  exit 1
fi

docker build -t god-tier-dev -f .devcontainer/Dockerfile .
echo ""
echo "Image built: god-tier-dev"
echo "Run 'mise run devcontainer:up PROVIDER=docker' to start."
"""

[tasks."devcontainer:rebuild"]
description = "Rebuild DevContainer without cache"
run = """
echo "=== Rebuilding DevContainer (no cache) ==="
if ! command -v docker &> /dev/null; then
  echo "ERROR: Docker not installed"
  exit 1
fi

docker build --no-cache -t god-tier-dev -f .devcontainer/Dockerfile .
echo ""
echo "Image rebuilt: god-tier-dev"
"""

[tasks."devcontainer:logs"]
description = "View DevContainer logs"
run = """
PROVIDER="${PROVIDER:-docker}"

echo "=== DevContainer Logs ==="

if [ "$PROVIDER" = "devpod" ]; then
  if command -v devpod &> /dev/null; then
    devpod logs . 2>/dev/null || echo "No DevPod logs available"
  else
    echo "DevPod not installed"
  fi
else
  CONTAINER=$(docker ps -q --filter 'name=god-tier-devcontainer' 2>/dev/null | head -1)
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -aq --filter 'name=devcontainer' 2>/dev/null | head -1)
  fi
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -aq --filter 'name=vsc-' 2>/dev/null | head -1)
  fi
  
  if [ -n "$CONTAINER" ]; then
    docker logs "$CONTAINER" 2>&1 | tail -100
  else
    echo "No devcontainer found."
  fi
fi
"""

[tasks."devcontainer:exec"]
description = "Execute command in DevContainer (usage: mise run devcontainer:exec '<cmd>')"
run = '''
sh -c '
PROVIDER="${PROVIDER:-docker}"

if [ -z "$1" ]; then
  echo "Usage: mise run devcontainer:exec \"<command>\""
  echo "Example: mise run devcontainer:exec \"mise doctor\""
  exit 1
fi

if [ "$PROVIDER" = "devpod" ]; then
  if command -v devpod &> /dev/null; then
    devpod ssh . --command "$*"
  else
    echo "DevPod not installed"
    exit 1
  fi
else
  CONTAINER=$(docker ps -q --filter "name=god-tier-devcontainer" 2>/dev/null | head -1)
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -q --filter "name=devcontainer" 2>/dev/null | head -1)
  fi
  if [ -z "$CONTAINER" ]; then
    CONTAINER=$(docker ps -q --filter "name=vsc-" 2>/dev/null | head -1)
  fi

  if [ -n "$CONTAINER" ]; then
    docker exec "$CONTAINER" sh -c "$*"
  else
    echo "No running devcontainer found."
    exit 1
  fi
fi
' --
'''

[tasks."devcontainer:restart"]
description = "Restart DevContainer (PROVIDER=devpod|docker)"
run = """
PROVIDER="${PROVIDER:-docker}"

echo "=== Restarting DevContainer ==="

# Stop first
if [ "$PROVIDER" = "docker" ]; then
  CONTAINER=$(docker ps -q --filter 'name=god-tier-devcontainer' 2>/dev/null)
  if [ -n "$CONTAINER" ]; then
    echo "Stopping container..."
    docker stop "$CONTAINER" > /dev/null
  fi
  
  # Start
  echo "Starting container..."
  docker start god-tier-devcontainer > /dev/null 2>&1 || {
    echo "No container to restart. Use 'mise run devcontainer:up' first."
    exit 1
  }
elif [ "$PROVIDER" = "devpod" ]; then
  devpod stop . 2>/dev/null || true
  devpod up .
fi

echo "DevContainer restarted."
"""

[tasks."devcontainer:delete"]
description = "Delete DevContainer and volumes (PROVIDER=devpod|docker)"
run = """
PROVIDER="${PROVIDER:-devpod}"
WORKSPACE="${WORKSPACE:-.}"

echo "=== Deleting DevContainer ==="

if [ "$PROVIDER" = "devpod" ]; then
  if command -v devpod &> /dev/null; then
    devpod delete "$WORKSPACE" 2>/dev/null || echo "No DevPod workspace to delete"
  else
    echo "DevPod not installed"
  fi
elif [ "$PROVIDER" = "docker" ]; then
  CONTAINER=$(docker ps -aq --filter 'name=god-tier-devcontainer' 2>/dev/null)
  if [ -n "$CONTAINER" ]; then
    docker rm -f "$CONTAINER"
    echo "Container removed."
  fi
  
  echo "Removing volumes..."
  docker volume rm god-tier-mise-data 2>/dev/null || true
  docker volume rm god-tier-mise-config 2>/dev/null || true
  echo "Volumes removed."
fi

echo ""
echo "DevContainer deleted."
"""


# God-Tier macOS Development Environment - Mise Configuration
# This is the source of truth for mise tools and tasks
# To apply: cp config/mise.toml ~/.config/mise/config.toml

[settings]
experimental = true
not_found_auto_install = true
status = { missing_tools = "if_other_versions_installed" }
lockfile = true

[settings.npm]
bun = true
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.python]
compile = false
uv_venv_auto = true

[shell_alias]
npm = "bun"
npx = "bunx"
pip = "uv pip"
pip3 = "uv pip"

[tools]
# Strict Hierarchy: Mise > Bun > Pixi > Uv

# --- Core Runtimes ---
bun = "latest"
node = "latest"
python = "latest"
go = "latest"
rust = "latest"
pixi = "latest"
uv = "latest"
chezmoi = "latest"
usage = "latest"
pkl = "latest"

# --- Modern Rust-Based Utilities ---
starship = "latest"
ripgrep = "latest"
fd = "latest"
zoxide = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
delta = "latest"
lsd = "latest"
hyperfine = "latest"
glow = "latest"
atuin = "latest"
"github:ast-grep/ast-grep" = "latest"

# --- Security & Encryption ---
"aqua:FiloSottile/age" = "latest"

# --- Data Processing ---
jq = "latest"
yq = "latest"

# --- Code Quality ---
"aqua:koalaman/shellcheck" = "latest"
"aqua:hadolint/hadolint" = "latest"
"npm:@biomejs/biome" = "latest"
"pipx:pre-commit" = "latest"
lefthook = "latest"

# --- AI-Assisted Code Search ---
"pipx:mgrep" = "latest"

# --- Infrastructure ---
"1password-cli" = "latest"
awscli = { version = "latest", symlink_bins = "true" }

# --- Development Daemon Manager ---
pitchfork = "latest"

# --- Container Tools ---
"aqua:loft-sh/devpod" = "latest"

# --- CLI Tools ---
github-cli = "latest"

# --- Test Tools ---
"npm:bats" = "latest"
"ubi:charmbracelet/gum" = "latest"

"npm:@ralph-orchestrator/ralph-cli" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:opencode-ai" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:jscpd" = "latest"

[tasks.dashboard]
description = "Launch Unified TUI"
dir = "$DEV_ENV_ROOT"
run = "pixi run python config/scripts/dashboard.py"

[tasks.validate]
description = "Validate environment health"
run = "sh $DEV_ENV_ROOT/config/scripts/validate.sh"

[tasks."validate:strict"]
description = "Validate with warnings as errors"
run = "sh $DEV_ENV_ROOT/config/scripts/validate.sh --strict"

[tasks."validate:quick"]
description = "Quick health check (core tools only)"
run = """
echo "=== Quick Health Check ==="
ERRORS=0

if ! command -v mise &> /dev/null; then
  echo "FAIL: mise not installed"
  ERRORS=1
else
  echo "OK: mise $(mise --version | head -c 20)"
fi

if ! command -v bun &> /dev/null; then
  echo "FAIL: bun not installed"
  ERRORS=1
else
  echo "OK: bun $(bun --version)"
fi

if ! command -v uv &> /dev/null; then
  echo "FAIL: uv not installed"
  ERRORS=1
else
  echo "OK: uv $(uv --version 2>&1 | head -1)"
fi

if echo "$PATH" | grep -q "mise"; then
  echo "OK: mise in PATH"
else
  echo "WARN: mise shims not in PATH"
fi

if [ $ERRORS -gt 0 ]; then
  echo ""
  echo "FAILED: $ERRORS critical issue(s)"
  exit 1
else
  echo ""
  echo "PASSED: Core tools healthy"
fi
"""

[tasks."hooks:install"]
description = "Install lefthook-managed git hooks"
run = """
if command -v lefthook >/dev/null 2>&1; then
  lefthook install
  echo "✅ Lefthook installed git hooks"
else
  echo "ERROR: lefthook not installed. Run 'mise use -g lefthook' first."
  exit 1
fi
"""

[tasks."hooks:test"]
description = "Run lefthook pre-commit checks"
run = "lefthook run pre-commit"

[tasks.lint]
description = "Lint shell scripts with shellcheck"
run = "find . -name '*.sh' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.pixi/*' -not -path '*/research/repos/*' -exec shellcheck --exclude=SC2016,SC2088,SC2034,SC2129,SC2059 {} +"

[tasks.help]
description = "Show System Manual"
run = "gum format --theme=pink < $DEV_ENV_ROOT/MANUAL.md"

[tasks."agent:check"]
description = "Verify AWS/cloud credentials are configured"
run = """
echo "=== Checking Cloud Credentials ==="
ERRORS=0

if ! command -v sky &> /dev/null; then
  echo "ERROR: SkyPilot not installed. Run: mise install"
  exit 1
fi

if ! sky check aws 2>&1 | grep -q "enabled"; then
  echo "ERROR: AWS not enabled in SkyPilot"
  echo ""
  echo "To configure AWS credentials:"
  echo "  1. Run: aws configure"
  echo "  2. Or set: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
  echo "  3. Then run: sky check"
  echo ""
  echo "See SKYPILOT.md for detailed setup instructions."
  exit 1
fi

echo "AWS credentials: OK"
sky check aws 2>&1 | grep -E "AWS|enabled" || true
"""

[tasks."agent:up"]
description = "Launch Cloud Agent (CLUSTER=name to customize)"
depends = ["agent:check"]
run = """
CLUSTER="${CLUSTER:-ai-agent}"
echo "Launching cloud agent: $CLUSTER"
sky launch -c "$CLUSTER" $DEV_ENV_ROOT/templates/agent.yaml --detach
"""

[tasks."agent:down"]
description = "Terminate Cloud Agent (CLUSTER=name or -- name)"
run = """
CLUSTER="${CLUSTER:-${1:-ai-agent}}"
echo "Terminating cloud agent: $CLUSTER"
sky down "$CLUSTER" -y
"""

[tasks."agent:status"]
description = "Show Cloud Agent status (CLUSTER=name for specific agent)"
run = """
echo "=== Cloud Agent Status ==="
if ! command -v sky &> /dev/null; then
  echo "SkyPilot not installed. Run: mise install"
  exit 1
fi

CLUSTER="${CLUSTER:-${1:-}}"

if [ -n "$CLUSTER" ]; then
  # Specific cluster - show detailed info
  echo "Cluster: $CLUSTER"
  echo ""
  
  # Check if cluster exists
  if ! sky status 2>/dev/null | grep -q "^$CLUSTER "; then
    echo "ERROR: Cluster '$CLUSTER' not found"
    echo ""
    echo "Available clusters:"
    sky status 2>/dev/null | tail -n +2 | awk '{print "  " $1 " (" $NF ")"}'
    exit 1
  fi
  
  # Get IP address
  IP=$(sky status --ip "$CLUSTER" 2>/dev/null)
  if [ -n "$IP" ]; then
    echo "IP Address: $IP"
    echo "SSH: ssh $CLUSTER"
    echo ""
  fi
  
  # Verbose status for this cluster
  sky status -v 2>/dev/null | grep -E "(NAME|$CLUSTER)" | head -5
  echo ""
  
  ENDPOINTS=$(sky status --endpoints "$CLUSTER" 2>&1 || true)
  if [ -n "$ENDPOINTS" ] && [[ ! "$ENDPOINTS" =~ "does not have any ports" ]] && [ "$ENDPOINTS" != "{}" ]; then
    echo "Endpoints:"
    echo "$ENDPOINTS"
    echo ""
  fi
  
  echo "Cost Report:"
  sky cost-report 2>/dev/null | grep -E "(NAME|$CLUSTER)" || echo "  No cost data available"
else
  # All clusters - show overview with verbose info
  sky status -v 2>/dev/null || echo "No clusters found"
  echo ""
  
  # Show cost report
  echo "=== Cost Report ==="
  sky cost-report 2>/dev/null || echo "No cost data available"
  echo ""
  
  CLUSTERS=$(sky status 2>/dev/null | grep -E "\\s+(UP|STOPPED|INIT)\\s+" | awk '{print $1}')
  if [ -n "$CLUSTERS" ]; then
    echo "=== Quick Reference ==="
    for c in $CLUSTERS; do
      IP=$(sky status --ip "$c" 2>/dev/null)
      if [ -n "$IP" ]; then
        echo "  $c: ssh $c (IP: $IP)"
      else
        echo "  $c: (no IP - may be stopped)"
      fi
    done
  fi
  echo ""
  echo "For ALL AWS services (EC2, RDS, ALB, S3): mise run aws:status"
fi
"""

[tasks."agent:stop"]
description = "Stop Cloud Agent (CLUSTER=name or -- name)"
run = """
if ! command -v sky &> /dev/null; then
  echo "ERROR: SkyPilot not installed. Run: mise install"
  exit 1
fi

echo "WARNING: Spot instances cannot be stopped, only terminated."
echo "Use 'mise run agent:down' to terminate completely."
echo ""

CLUSTER="${CLUSTER:-${1:-}}"
if [ -z "$CLUSTER" ]; then
  echo "Available clusters:"
  sky status 2>/dev/null | grep -E "UP|STOPPED" | awk '{print "  " $1 " (" $NF ")"}'
  echo ""
  echo "Usage: CLUSTER=<name> mise run agent:stop"
  echo "   or: mise run agent:stop -- <name>"
  exit 1
fi
echo "Stopping cloud agent: $CLUSTER"
sky stop "$CLUSTER" -y
echo ""
echo "Agent stopped. Use 'mise run agent:start' to resume."
echo "Use 'mise run agent:down' to terminate completely."
"""

[tasks."agent:start"]
description = "Start stopped Cloud Agent (CLUSTER=name or -- name)"
run = """
if ! command -v sky &> /dev/null; then
  echo "ERROR: SkyPilot not installed. Run: mise install"
  exit 1
fi

if ! sky check aws 2>&1 | grep -q "enabled"; then
  echo "ERROR: AWS credentials not configured"
  echo "Run: mise run agent:check"
  exit 1
fi

echo "⚠️  WARNING: Spot instances cannot be stopped or restarted."
echo "   Spot instances are terminated when stopped (not paused)."
echo "   If no stopped clusters found, use 'mise run agent:up' to launch new."
echo ""

CLUSTER="${CLUSTER:-${1:-}}"
if [ -z "$CLUSTER" ]; then
  STOPPED=$(sky status 2>/dev/null | grep "STOPPED" | awk '{print $1}')
  if [ -z "$STOPPED" ]; then
    echo "No stopped clusters found."
    sky status
    exit 1
  fi
  echo "Stopped clusters:"
  echo "$STOPPED" | while read c; do echo "  $c"; done
  echo ""
  echo "Usage: CLUSTER=<name> mise run agent:start"
  echo "   or: mise run agent:start -- <name>"
  exit 1
fi
echo "Starting cloud agent: $CLUSTER"
sky start "$CLUSTER" -y
echo ""
echo "Agent started. Use 'ssh $CLUSTER' to connect."
"""

[tasks."agent:restart"]
description = "Restart Cloud Agent (CLUSTER=name)"
run = """
if ! command -v sky &> /dev/null; then
  echo "ERROR: SkyPilot not installed. Run: mise install"
  exit 1
fi

echo "WARNING: Spot instances cannot be stopped."
echo "To recreate: mise run agent:down && mise run agent:up"
echo ""

CLUSTER="${CLUSTER:-${1:-ai-agent}}"
echo "Restarting cloud agent: $CLUSTER"
sky stop "$CLUSTER" -y
sky start "$CLUSTER" -y
echo "Cloud agent $CLUSTER restarted."
"""

[tasks."agent:ssh"]
description = "SSH into Cloud Agent (CLUSTER=name or -- name)"
run = """
CLUSTER="${CLUSTER:-${1:-}}"
if [ -z "$CLUSTER" ]; then
  RUNNING=$(sky status 2>/dev/null | grep "UP" | awk '{print $1}')
  if [ -z "$RUNNING" ]; then
    echo "No running clusters found."
    sky status
    exit 1
  fi
  if [ $(echo "$RUNNING" | wc -l) -eq 1 ]; then
    CLUSTER="$RUNNING"
  else
    echo "Multiple running clusters:"
    echo "$RUNNING" | while read c; do echo "  $c"; done
    echo ""
    echo "Usage: CLUSTER=<name> mise run agent:ssh"
    exit 1
  fi
fi
echo "Connecting to: $CLUSTER"
ssh "$CLUSTER"
"""

[tasks."agent:logs"]
description = "View Cloud Agent logs (CLUSTER=name)"
run = """
CLUSTER="${CLUSTER:-${1:-ai-agent}}"
sky logs "$CLUSTER"
"""

[tasks."agent:exec"]
description = "Execute command on Cloud Agent (CLUSTER=name -- <cmd>)"
run = """
CLUSTER="${CLUSTER:-ai-agent}"
if [ -z "$1" ]; then
  echo "Usage: mise run agent:exec -- <command>"
  echo "   or: CLUSTER=<name> mise run agent:exec -- <command>"
  echo "Example: mise run agent:exec -- 'python train.py'"
  exit 1
fi
sky exec "$CLUSTER" "$@"
"""

[tasks."aws:status"]
description = "Show all AWS services (EC2, RDS, ALB, S3)"
run = """
echo "=== AWS Services Status ==="

AWS_CMD=""
if command -v aws &> /dev/null; then
  AWS_CMD="aws"
elif [ -f "$HOME/.local/share/mise/shims/aws" ]; then
  AWS_PATH=$(find "$HOME/.local/share/mise/installs/awscli" -name "aws" -type f 2>/dev/null | head -1)
  if [ -n "$AWS_PATH" ]; then
    AWS_CMD="$AWS_PATH"
  fi
fi

if [ -z "$AWS_CMD" ]; then
  echo "AWS CLI not installed."
  echo "Install with: mise use -g awscli@latest"
  exit 1
fi

if ! $AWS_CMD sts get-caller-identity &> /dev/null; then
  echo "ERROR: AWS credentials not configured"
  echo "Run: aws configure"
  exit 1
fi

ACCOUNT=$($AWS_CMD sts get-caller-identity --query 'Account' --output text 2>/dev/null)
REGION=$($AWS_CMD configure get region 2>/dev/null || echo "us-east-1")
echo "Account: $ACCOUNT | Region: $REGION"
echo ""

echo "=== EC2 Instances (Running) ==="
EC2_QUERY='Reservations[*].Instances[*].[Tags[?Key==`Name`]|[0].Value,InstanceId,InstanceType,PublicIpAddress,State.Name]'
$AWS_CMD ec2 describe-instances --filters Name=instance-state-name,Values=running --query "$EC2_QUERY" --output table 2>/dev/null || echo "No running instances"
echo ""

echo "=== RDS Databases ==="
RDS_QUERY='DBInstances[*].[DBInstanceIdentifier,Engine,DBInstanceStatus,Endpoint.Address]'
$AWS_CMD rds describe-db-instances --query "$RDS_QUERY" --output table 2>/dev/null || echo "No RDS instances"
echo ""

echo "=== Load Balancers ==="
ELB_QUERY='LoadBalancers[*].[LoadBalancerName,State.Code,DNSName]'
$AWS_CMD elbv2 describe-load-balancers --query "$ELB_QUERY" --output table 2>/dev/null || echo "No load balancers"
echo ""

echo "=== S3 Buckets ==="
S3_QUERY='Buckets[*].[Name,CreationDate]'
$AWS_CMD s3api list-buckets --query "$S3_QUERY" --output table 2>/dev/null || echo "No S3 buckets"
echo ""

echo "=== SkyPilot Clusters ==="
if command -v sky &> /dev/null; then
  sky status 2>/dev/null | head -15 || echo "No SkyPilot clusters"
else
  echo "SkyPilot not installed"
fi
echo ""

echo "For SkyPilot details: mise run agent:status"
echo "For cost report: mise run agent:status (includes costs)"
"""

[tasks.setup-extensions]
description = "Install AI extensions"
run = "gh extension install github/gh-copilot --force"

[tasks.setup-mac]
description = "Configure macOS defaults"
run = "sh $DEV_ENV_ROOT/config/scripts/macos-defaults.sh"

[tasks.setup-mcp]
description = "Configure mise MCP"
run = "sh $DEV_ENV_ROOT/config/scripts/setup-mcp.sh"

# =============================================================================
# SwiftBar Menu Bar Tasks
# =============================================================================

[tasks."menubar:install"]
description = "Install SwiftBar and configure plugin"
run = """
echo "=== SwiftBar Menu Bar Installation ==="
echo ""

# Check if SwiftBar is installed
if [ -d "/Applications/SwiftBar.app" ]; then
  echo "✅ SwiftBar is already installed"
else
  echo "📥 Installing SwiftBar via Homebrew..."
  if command -v brew &> /dev/null; then
    brew install --cask swiftbar
    echo "✅ SwiftBar installed"
  else
    echo "❌ Homebrew not found. Install SwiftBar manually:"
    echo "   https://swiftbar.app"
    exit 1
  fi
fi

# Configure plugin directory
PLUGIN_DIR="{{config_root}}/config/scripts"
echo ""
echo "📂 Configuring SwiftBar plugin directory..."
defaults write com.ameba.SwiftBar PluginDirectory "$PLUGIN_DIR"
echo "✅ Plugin directory set to: $PLUGIN_DIR"

# Make plugin executable
chmod +x "$PLUGIN_DIR/dev-status.1m.sh"
echo "✅ Plugin made executable"

# Launch SwiftBar
echo ""
echo "🚀 Launching SwiftBar..."
open -a SwiftBar

echo ""
echo "✨ SwiftBar setup complete!"
echo "   Look for the status icon in your menu bar"
"""

[tasks."menubar:uninstall"]
description = "Remove SwiftBar configuration"
run = """
echo "=== SwiftBar Removal ==="
defaults delete com.ameba.SwiftBar PluginDirectory 2>/dev/null || true
echo "✅ SwiftBar configuration removed"
echo ""
echo "To fully uninstall SwiftBar:"
echo "  brew uninstall --cask swiftbar"
"""

[tasks."menubar:status"]
description = "Show SwiftBar status"
run = """
echo "=== SwiftBar Status ==="
echo ""

if [ -d "/Applications/SwiftBar.app" ]; then
  echo "✅ SwiftBar: Installed"
  
  # Check if running
  if pgrep -x "SwiftBar" > /dev/null; then
    echo "✅ SwiftBar: Running"
  else
    echo "⚪ SwiftBar: Not running"
  fi
  
  # Show plugin directory
  PLUGIN_DIR=$(defaults read com.ameba.SwiftBar PluginDirectory 2>/dev/null || echo "Not configured")
  echo "📂 Plugin directory: $PLUGIN_DIR"
  
  # List plugins
  if [ -d "$PLUGIN_DIR" ]; then
    echo ""
    echo "📋 Plugins found:"
    ls -la "$PLUGIN_DIR"/*.sh 2>/dev/null | awk '{print "   " $NF}'
  fi
else
  echo "❌ SwiftBar: Not installed"
  echo ""
  echo "Install with: mise run menubar:install"
fi
"""

[tasks."menubar:refresh"]
description = "Refresh SwiftBar plugins"
run = """
echo "🔄 Refreshing SwiftBar..."
osascript -e 'tell application "SwiftBar" to refreshAllPlugins'
echo "✅ All plugins refreshed"
"""

[tasks."menubar:open"]
description = "Open SwiftBar app"
run = """
if [ -d "/Applications/SwiftBar.app" ]; then
  open -a SwiftBar
  echo "✅ SwiftBar opened"
else
  echo "❌ SwiftBar not installed"
  echo "Install with: mise run menubar:install"
fi
"""

[tasks."menubar:edit"]
description = "Edit the dev-status plugin"
run = """
PLUGIN="{{config_root}}/config/scripts/dev-status.1m.sh"
if [ -f "$PLUGIN" ]; then
  ${EDITOR:-open} "$PLUGIN"
else
  echo "❌ Plugin not found: $PLUGIN"
fi
"""

# =============================================================================
# DevEnvManager Native App Tasks
# =============================================================================

[tasks."devenv-app:install"]
description = "Install DevEnvManager.app (downloads prebuilt release)"
run = """
#!/bin/bash
set -euo pipefail

echo "=== DevEnvManager Installation ==="
echo ""

REPO="ray-manaloto/gemini-ai-macos-development-environment"
APP_NAME="DevEnvManager.app"
INSTALL_DIR="$HOME/Applications"
DOWNLOAD_DIR="${TMPDIR:-/tmp}/devenvmanager-install"

# Check if already installed
if [ -d "$INSTALL_DIR/$APP_NAME" ]; then
  echo "⚠️  DevEnvManager is already installed at: $INSTALL_DIR/$APP_NAME"
  echo ""
  read -p "Do you want to reinstall? (y/N) " -n 1 -r
  echo ""
  if [[ ! $REPLY =~ ^[Yy]$ ]]; then
    echo "Installation cancelled."
    exit 0
  fi
  echo "Removing existing installation..."
  rm -rf "$INSTALL_DIR/$APP_NAME"
fi

# Get latest release
echo "📥 Fetching latest release from GitHub..."
RELEASE_URL=$(gh api repos/$REPO/releases/latest --jq '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' 2>/dev/null || echo "")

if [ -z "$RELEASE_URL" ]; then
  echo "❌ No release found. The app may need to be built first."
  echo ""
  echo "Options:"
  echo "  1. Build from source: mise run devenv-app:build"
  echo "  2. Wait for CI to create a release"
  echo ""
  echo "For contributors, see: DevEnvManager/README.md"
  exit 1
fi

# Download and extract
mkdir -p "$DOWNLOAD_DIR"
cd "$DOWNLOAD_DIR"

echo "📥 Downloading: $(basename $RELEASE_URL)"
curl -fsSL -o devenvmanager.zip "$RELEASE_URL"

echo "📦 Extracting..."
unzip -q -o devenvmanager.zip

# Install
mkdir -p "$INSTALL_DIR"
mv "$APP_NAME" "$INSTALL_DIR/"

# Cleanup
rm -rf "$DOWNLOAD_DIR"

echo ""
echo "✅ DevEnvManager installed to: $INSTALL_DIR/$APP_NAME"
echo ""
echo "🚀 Launching DevEnvManager..."
open "$INSTALL_DIR/$APP_NAME"
echo ""
echo "The app icon should appear in your menu bar."
echo "Run 'mise run devenv-app:status' to check."
"""

[tasks."devenv-app:build"]
description = "Build DevEnvManager from source (requires Xcode.app)"
run = """
#!/bin/bash
set -euo pipefail

echo "=== DevEnvManager Build ==="
echo ""

# Check for Xcode
if ! xcode-select -p | grep -q "Xcode.app"; then
  echo "❌ Full Xcode.app is required to build DevEnvManager."
  echo ""
  echo "Current developer path: $(xcode-select -p)"
  echo ""
  echo "To install Xcode:"
  echo "  1. Download from Mac App Store: https://apps.apple.com/us/app/xcode/id497799835"
  echo "  2. After install, run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer"
  echo ""
  echo "Alternative: Install prebuilt app with: mise run devenv-app:install"
  exit 1
fi

# Check for XcodeGen
if ! command -v xcodegen &> /dev/null; then
  echo "📥 Installing XcodeGen..."
  mise use -g "ubi:yonaskolb/XcodeGen"
  mise reshim
fi

cd "{{config_root}}/DevEnvManager"

# Generate Xcode project
echo "📝 Generating Xcode project..."
xcodegen generate

# Build
echo "🔨 Building DevEnvManager..."
xcodebuild -scheme DevEnvManager -configuration Release -derivedDataPath build clean build

# Find the built app
APP_PATH="build/Build/Products/Release/DevEnvManager.app"
if [ ! -d "$APP_PATH" ]; then
  echo "❌ Build failed - app not found at: $APP_PATH"
  exit 1
fi

# Install to ~/Applications
INSTALL_DIR="$HOME/Applications"
mkdir -p "$INSTALL_DIR"

if [ -d "$INSTALL_DIR/DevEnvManager.app" ]; then
  echo "⚠️  Replacing existing installation..."
  rm -rf "$INSTALL_DIR/DevEnvManager.app"
fi

cp -R "$APP_PATH" "$INSTALL_DIR/"

echo ""
echo "✅ DevEnvManager built and installed to: $INSTALL_DIR/DevEnvManager.app"
echo ""
echo "🚀 Launching DevEnvManager..."
open "$INSTALL_DIR/DevEnvManager.app"
"""

[tasks."devenv-app:status"]
description = "Show DevEnvManager status"
run = """
echo "=== DevEnvManager Status ==="
echo ""

INSTALL_DIR="$HOME/Applications"
APP_PATH="$INSTALL_DIR/DevEnvManager.app"

if [ -d "$APP_PATH" ]; then
  echo "✅ Installed: $APP_PATH"
  
  # Get version from Info.plist
  VERSION=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "unknown")
  echo "   Version: $VERSION"
  
  # Check if running
  if pgrep -x "DevEnvManager" > /dev/null; then
    PID=$(pgrep -x "DevEnvManager")
    echo "✅ Running (PID: $PID)"
  else
    echo "⚪ Not running"
  fi
else
  echo "❌ Not installed"
  echo ""
  echo "Install with: mise run devenv-app:install"
fi
"""

[tasks."devenv-app:open"]
description = "Open DevEnvManager app"
run = """
INSTALL_DIR="$HOME/Applications"
APP_PATH="$INSTALL_DIR/DevEnvManager.app"

if [ -d "$APP_PATH" ]; then
  open "$APP_PATH"
  echo "✅ DevEnvManager opened"
else
  echo "❌ DevEnvManager not installed"
  echo "Install with: mise run devenv-app:install"
fi
"""

[tasks."devenv-app:quit"]
description = "Quit DevEnvManager app"
run = """
if pgrep -x "DevEnvManager" > /dev/null; then
  osascript -e 'tell application "DevEnvManager" to quit'
  echo "✅ DevEnvManager quit"
else
  echo "⚪ DevEnvManager is not running"
fi
"""

[tasks."devenv-app:restart"]
description = "Restart DevEnvManager app"
run = """
INSTALL_DIR="$HOME/Applications"
APP_PATH="$INSTALL_DIR/DevEnvManager.app"

if [ ! -d "$APP_PATH" ]; then
  echo "❌ DevEnvManager not installed"
  echo "Install with: mise run devenv-app:install"
  exit 1
fi


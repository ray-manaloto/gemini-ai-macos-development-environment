name: Claude Code AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    # Only run on @claude mentions or PR opened events
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Restrict tools to safe read-only operations
          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh pr:*),Bash(gh issue:*)"'
          track_progress: true
          prompt: |
            You are reviewing code for a macOS development environment project.
            
            Focus on:
            - Shell script safety and POSIX compliance
            - Mise configuration correctness
            - BATS test quality
            - Security issues (no hardcoded secrets, proper permissions)
            - Documentation accuracy
            
            Provide constructive, specific feedback.

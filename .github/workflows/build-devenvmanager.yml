name: Build DevEnvManager

on:
  push:
    branches: [main]
    paths:
      - 'DevEnvManager/**'
      - '.github/workflows/build-devenvmanager.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DevEnvManager/**'
      - '.github/workflows/build-devenvmanager.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

env:
  APP_NAME: DevEnvManager
  SCHEME: DevEnvManager
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract version from project.yml
            VERSION="v$(grep 'MARKETING_VERSION' DevEnvManager/project.yml | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate Xcode Project
        working-directory: DevEnvManager
        run: xcodegen generate

      - name: Build App
        id: build
        working-directory: DevEnvManager
        run: |
          # Verify project was generated
          ls -la *.xcodeproj || { echo "ERROR: xcodeproj not found"; exit 1; }
          
          # Build for both architectures (Universal Binary)
          xcodebuild \
            -project DevEnvManager.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          # Find the built app
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Built app at: $APP_PATH"

          # Create artifact directory
          mkdir -p artifacts

          # Create zip archive
          ARTIFACT_NAME="${APP_NAME}-${{ steps.version.outputs.version }}-universal.zip"
          ditto -c -k --keepParent "$APP_PATH" "artifacts/$ARTIFACT_NAME"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

          # Show artifact info
          ls -la artifacts/
          echo "Artifact size: $(du -h "artifacts/$ARTIFACT_NAME" | cut -f1)"

      - name: Verify App Bundle
        working-directory: DevEnvManager
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)

          # Check binary architectures
          echo "Binary architectures:"
          lipo -info "$APP_PATH/Contents/MacOS/$APP_NAME"

          # Check Info.plist
          echo "Bundle version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist"

          # Check minimum macOS version
          echo "Minimum macOS version:"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP_PATH/Contents/Info.plist"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build
          path: DevEnvManager/artifacts/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "DevEnvManager ${{ needs.build.outputs.version }}"
          body: |
            ## DevEnvManager ${{ needs.build.outputs.version }}

            Native macOS menu bar app for managing development tools.

            ### Installation

            **Recommended:** Use mise to install:
            ```bash
            mise run devenv-app:install
            ```

            **Manual:** Download and extract `${{ needs.build.outputs.artifact_name }}`, then move `DevEnvManager.app` to `~/Applications/`.

            ### Requirements
            - macOS 14.0+ (Sonoma)
            - Universal Binary (Apple Silicon + Intel)

            ### Features
            - Mise tool management
            - Homebrew services control
            - OrbStack integration (Linux machines, Docker containers)
            - Port detection via lsof

            ### Changelog
            See [DevEnvManager/README.md](https://github.com/${{ github.repository }}/blob/main/DevEnvManager/README.md) for feature details.
          files: |
            artifacts/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true

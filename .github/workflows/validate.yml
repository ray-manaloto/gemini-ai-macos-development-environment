name: Validate Environment

on: [push, pull_request]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Pkl (Mandatory for config generation)
      - name: Install Pkl
        run: |
          curl -sL https://github.com/apple/pkl/releases/latest/download/pkl-macos-aarch64 -o /usr/local/bin/pkl
          chmod +x /usr/local/bin/pkl

      # 2. Validate Pkl Config Compiles
      - name: Compile Pkl -> TOML
        run: |
          mkdir -p ~/.config/dev-env
          cp -r . ~/.config/dev-env
          pkl eval -f toml config/main.pkl > mise.toml

      # 3. Install Mise and Validate
      - uses: jdx/mise-action@v2
        with:
          config_file: mise.toml

      # 4. Run Validation Script
      - name: Run Validation
        run: bash config/scripts/validate.sh

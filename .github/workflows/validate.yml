name: Validate Environment

on: [push, pull_request]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dev-env symlink
        run: |
          mkdir -p ~/.config
          ln -sfn $GITHUB_WORKSPACE ~/.config/dev-env

      - name: Validate TOML syntax
        run: |
          python3 -c "import tomllib; tomllib.load(open('config/mise.toml', 'rb'))"
          echo "TOML syntax valid"

      - uses: jdx/mise-action@v2
        with:
          config_file: config/mise.toml

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Lint shell scripts
        run: mise run lint

      - name: Run Validation Script
        run: bash config/scripts/validate.sh
